- tip: Set rules for your kids about the internet
  rank: 28
  area: Scams & privacy
  grade: C
  finding: The evidence is mixed. In a survey of 25,142 European children, rules were linked with lower online risk (and fewer opportunities and skills); in a US study of 215 parent-teen pairs, more use of monitoring apps and controls was linked with more risk.
  source: {title: "Duerager & Livingstone, How can parents support children's internet safety? (EU Kids Online, LSE)", url: "https://eprints.lse.ac.uk/42872/", year: 2012}
