  finding: CISA recommends it to highly targeted officials after the 2024 compromise of US telecom networks, but cites no measured data on individuals.
  source: {title: "CISA, Mobile Communications Best Practice Guidance", url: "https://www.cisa.gov/sites/default/files/2024-12/guidance-mobile-communications-best-practices.pdf", year: 2024}

- tip: Monitor network traffic on your router
  rank: 13
  area: Network & messaging
  grade: C
  finding: Impractical for most people; no data was found.

- tip: Test your firewall
  rank: 25
  area: Network & messaging
  grade: C
  finding: No data on the behaviour's effect was found.

- tip: Don't do online banking on a public computer
  rank: 38
  area: Network & messaging
  grade: C
  finding: No data on the behaviour's effect was found.

- tip: Use a VPN
  rank: 30
  area: Network & messaging
  grade: C
  finding: "No data showing a benefit for typical users was found. Free-to-download VPN apps carry real risks: of 283 such Android apps studied in 2015, 18% tunnelled traffic without encryption and 4% were flagged as malware by more than five scanners (38% by at least one)."
  source: {title: "Ikram et al., An Analysis of the Privacy and Security Risks of Android VPN Apps (IMC)", url: "https://research.csiro.au/isp/wp-content/uploads/sites/106/2016/08/paper-1.pdf", year: 2016}
  caveat: "At home you don't need one for safety; on public Wi-Fi, sites using https are already encrypted. Our suggestion, not evidence: if you use one, choose a provider with a good reputation over a free app."

