  caveat: Surveys linking parenting styles with exposure to risk, not measured harm. Talking with children about their internet use was linked with less harm.

- tip: Don't click on ads
  rank: 40
  area: Scams & privacy
  grade: B
  finding: Over 80% of the social-engineering download attacks seen on a large network started from ads on sites people visited, mostly pushing adware and unwanted programs.
  source: {title: "Nelms et al., Towards Measuring and Mitigating Social Engineering Software Download Attacks (USENIX Security)", url: "https://www.usenix.org/conference/usenixsecurity16/technical-sessions/presentation/nelms", year: 2016}
  caveat: Shows the threat is common, not the effect of avoiding clicks.
  kind: "observational study"

- tip: Watch out for phishing
  rank: 36
  area: Scams & privacy
  grade: B
  finding: Phishing victims were 400 times more likely to have their account hijacked than a random Google user, and phishing/spoofing was the most-reported crime type to the FBI in 2024 (193,407 complaints).
  source: {title: "Thomas et al., Data breaches, phishing, or malware? Understanding the risks of stolen credentials (ACM CCS)", url: "https://faculty.cc.gatech.edu/~frankli/papers/google_account_compromise.pdf", year: 2017}
  also: {title: "FBI IC3, 2024 Internet Crime Report", url: "https://www.ic3.gov/AnnualReport/Reports/2024_IC3Report.pdf", year: 2025}
  caveat: "Shows the threat is common and costly, not the effect of watching out. Awareness training alone has been measured and found to do little: in a study of over 19,500 hospital employees, recent annual training was not associated with fewer phishing-test failures, and randomised embedded training made very little difference (Ho et al., IEEE S&P 2025). Calling back on a number you know, and passkeys, limit the damage."
  do: "If a call, text, email or pop-up asks for a password, a code, a payment or remote access to your computer, stop. Hang up or close it, then contact the company on a number you already know, such as the one on your card or bill. Real banks, Microsoft and Apple never ask for the code they text you."
  kind: "vendor data; official statistics"
  zh: {tip: "警惕钓鱼和诈骗", finding: "被钓鱼骗走密码的人，账户被盗的可能性是普通谷歌用户的 400 倍；2024 年美国 FBI 收到最多的投诉类型就是钓鱼/仿冒（193,407 起）。", do: "任何电话、短信、邮件或弹窗索要密码、验证码、转账或远程控制电脑，一律停下：挂断或关闭，再通过你已知的官方号码（如银行卡背面的电话）核实。自称客服、公检法要求转账的，都是诈骗。软件只从官网或手机自带应用商店下载，别点下载站的“高速下载”按钮，安装时取消勾选捆绑软件。"}
